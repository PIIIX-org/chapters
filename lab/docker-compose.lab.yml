# Lab override for the repo's own docker-compose.yml (used by
# .github/workflows/elara-lab.yml):
#   docker compose -f docker-compose.yml -f lab/docker-compose.lab.yml up -d --build
#
# Differences from the shipped stack, and why:
# - mailpit + SMTP_*: signup verification mail must be readable so the lab
#   can create a second user through the real signup/verify/approve flow.
#   Without SMTP the code only lands in an in-process array (mailer.ts).
# - MCP_RATE_LIMIT: per-connection MCP limit (mcp/rate-limit.ts, default
#   120/min). Set in ./.env by the workflow; tests record any 429s.
# - BACKUP_LOCAL_PATH / BACKUP_RETENTION_COUNT: scheduled and on-demand
#   instance backups land in the data volume
#   (server/src/export/backup-service.ts, config.ts backup.*), so
#   backup-restore can restore one with `pnpm restore-backup`.
# - ELARA_VERSION build arg: the commit under test, baked into the image the
#   way publish.yml does it, so `/health` reports `version` (#583). Written
#   to ./.env by the lab-instance action. `context: .` is the repo root:
#   compose resolves paths against the first -f file.
# - extra_hosts host.docker.internal: restart-extraction serves the commit
#   under test as a git repository from the runner (lab/lib/git-fixture.ts)
#   and the app clones it from there, so every sync in the test sees the
#   same files while dev moves (#767).
services:
  app:
    build:
      context: .
      args:
        ELARA_VERSION: ${ELARA_VERSION:-}
    environment:
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=elara-lab@example.com
      - MCP_RATE_LIMIT
      - BACKUP_LOCAL_PATH=/data/backups
      - BACKUP_RETENTION_COUNT=3
    depends_on:
      mailpit:
        condition: service_started
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '8025:8025'
