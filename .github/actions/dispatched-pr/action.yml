name: Dispatched PR as the event
description: >-
  For a workflow_dispatch run with a PR number: loads the PR from the API,
  refuses it unless it is an open PR from this repository whose head is the
  commit this run is for, whose base is allowed, and whose merge
  (refs/pull/N/merge, checked out before this step) is the checkout; then
  writes an event file with `pull_request` set and exports its path as
  PR_EVENT_PATH, so a PR checker runs exactly as on a pull_request event.
  Used by pr-evidence.yml and fails-before.yml for PRs opened by
  state-md.yml: GitHub starts no pull_request workflows for a PR opened with
  GITHUB_TOKEN (#582). The checkout needs fetch-depth 2 or more.

inputs:
  pr:
    description: Number of the PR
    required: true
  bases:
    description: Space-separated base branches the check runs for
    required: true

runs:
  using: composite
  steps:
    - name: Load PR ${{ inputs.pr }} as the event
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
        BASES: ${{ inputs.bases }}
      run: |
        set -euo pipefail
        fail() { echo "::error title=Dispatched PR::$1"; exit 1; }
        [[ "$PR" =~ ^[0-9]+$ ]] || fail "pr must be a PR number, got '$PR'."
        gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/dispatched-pr.json"
        IFS=$'\t' read -r state head_repo head_ref head_sha base_ref < <(
          jq -r '[.state, (.head.repo.full_name // ""), .head.ref, .head.sha, .base.ref] | @tsv' "$RUNNER_TEMP/dispatched-pr.json"
        )
        [ "$state" = open ] || fail "PR #$PR is $state."
        [ "$head_repo" = "$GITHUB_REPOSITORY" ] || fail "PR #$PR comes from '$head_repo', not this repository."
        [ "$head_ref" = "$GITHUB_REF_NAME" ] || fail "PR #$PR's head branch is $head_ref; dispatch with --ref $head_ref."
        [ "$head_sha" = "$GITHUB_SHA" ] || fail "PR #$PR's head is $head_sha but this run is for $GITHUB_SHA; dispatch again."
        case " $BASES " in
          *" $base_ref "*) ;;
          *) fail "PR #$PR targets $base_ref; this check runs for: $BASES." ;;
        esac
        [ "$(git rev-parse HEAD^2)" = "$head_sha" ] ||
          fail "The checkout is not GitHub's merge of $head_sha (refs/pull/$PR/merge is not updated yet); dispatch again in a minute."
        jq --arg repo "$GITHUB_REPOSITORY" '{pull_request: ., repository: {full_name: $repo}}' \
          "$RUNNER_TEMP/dispatched-pr.json" > "$RUNNER_TEMP/dispatched-event.json"
        echo "PR_EVENT_PATH=$RUNNER_TEMP/dispatched-event.json" >> "$GITHUB_ENV"
        echo "Dispatched by \`$GITHUB_ACTOR\` for PR #$PR (head \`$head_sha\`, base \`$base_ref\`)." >> "$GITHUB_STEP_SUMMARY"
