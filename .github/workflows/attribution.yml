name: Commit attribution

# Agents commit from the owner's account, so a `Co-Authored-By: Name
# <email>` trailer is the only record that an agent wrote a commit (#580).
# On a PR from this repository whose head branch starts with `fix`, `ci`,
# `docs`, `feat`, `chore` or `test` followed by `/` or `-`, the
# `attribution` job fails if a commit lacks that trailer, unless the PR has
# the label `human-only`. Commits GitHub made and signed in its web UI
# ("Update branch", web edits) are exempt. Logic and messages:
# .github/scripts/attribution.mjs; rules: docs/agents/github-workflow.md
# (CI, Commit attribution).
#
# Not a required check (yet): it reports on every PR to `dev` or `prod`.
#
# On `merge_group` (the queue's temporary commit) the job forwards the PR's
# own result: it resolves the PR from the queue branch name and re-applies
# the conclusion of the latest `attribution` run on the PR head
# (.github/scripts/merge-group-forward.mjs), so the check also reports on
# the queue commit once it is required.

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  # The merge-group step reads the PR's check runs.
  checks: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD is GitHub's merge of the PR into its base; HEAD^1 (the base)
          # must be in the clone.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Run the base's copy of the checker so a PR cannot edit the check it
      # is judged by; until the base has one, run the PR's copy (the summary
      # says which). The copy runs alone from $RUNNER_TEMP, so the script
      # must stay a single file with no sibling imports.
      - name: Check every commit for a Co-Authored-By trailer
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          checker=.github/scripts/attribution.mjs
          if git cat-file -e "HEAD^1:$checker" 2>/dev/null; then
            git show "HEAD^1:$checker" > "$RUNNER_TEMP/attribution.mjs"
            ATTRIBUTION_CHECKER=base node "$RUNNER_TEMP/attribution.mjs"
          else
            ATTRIBUTION_CHECKER=pr node "$checker"
          fi
      # Queue commit: HEAD^1 is the queue base (dev, or the entry ahead), so
      # the same rule gives the base's copy of the forwarder; HEAD^2 is the
      # PR head the queue merged, which must still be the PR's live head
      # (fetch-depth 2 includes both parents).
      - name: Forward the PR's attribution result to the queue commit
        if: github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_GROUP_CHECK: attribution
        run: |
          export MERGE_GROUP_PR_HEAD="$(git rev-parse --verify --quiet HEAD^2 || true)"
          checker=.github/scripts/merge-group-forward.mjs
          if git cat-file -e "HEAD^1:$checker" 2>/dev/null; then
            git show "HEAD^1:$checker" > "$RUNNER_TEMP/merge-group-forward.mjs"
            MERGE_GROUP_CHECKER=base node "$RUNNER_TEMP/merge-group-forward.mjs"
          else
            MERGE_GROUP_CHECKER=pr node "$checker"
          fi
