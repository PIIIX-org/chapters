# Publishes the hosted-instance image. chapters-cloud's provisioner pulls
# ghcr.io/piiix-org/chapters:<version> for every customer it boots, so without
# this workflow the provisioner's `up` step dies on `pull access denied`.
#
# The ROOT Dockerfile is the right one: client + API + /mcp + /collab in one
# Fastify process on :3000, which is the single-container shape renderCompose
# and caddy.ts assume. Dockerfile.client and the two-container
# compose.deploy.yml split are the legacy single-tenant deployment.
#
# An image is only pushed for a commit whose CI `checks` job passed (#573):
# - `prod` pushes: ci.yml calls this workflow from its `publish` job, which
#   `needs: checks`, so publishing happens in the same CI run, same commit.
# - `v*` tags and manual dispatch: the `ci-gate` job below looks up CI on the
#   exact commit and refuses unless its latest `checks` job succeeded. A
#   dispatch can override with `force` + `reason`; the override is logged.
name: Publish image

on:
  workflow_call:
    inputs:
      dry_run:
        description: Build the image but do not push it.
        type: boolean
        default: false
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the image but do not push it.
        type: boolean
        default: false
      force:
        description: Publish even though CI did not pass on this commit (requires reason; logged).
        type: boolean
        default: false
      reason:
        description: Why the CI gate is being overridden (required with force).
        type: string
        default: ''

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a passing CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force == true }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # CI runs from push/workflow_dispatch test this exact commit;
          # pull_request runs test a merge ref, so they do not count.
          run_ids=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id')
          verdict=none
          latest=""
          for id in $run_ids; do
            # filter=latest: only the latest attempt of each run counts.
            job=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.name == "checks" and .status == "completed") | "\(.completed_at) \(.conclusion) \(.html_url)"')
            if [ -n "$job" ] && { [ -z "$latest" ] || [[ "$job" > "$latest" ]]; }; then
              latest=$job
            fi
          done
          if [ -n "$latest" ]; then
            read -r _ verdict url <<<"$latest"
            echo "Latest CI checks on $SHA: $verdict ($url)"
          else
            echo "No completed CI checks job found for $SHA"
          fi
          if [ "$verdict" = "success" ]; then
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            if [ -z "${REASON// /}" ]; then
              echo "::error::force=true requires a non-empty reason"
              exit 1
            fi
            msg="CI gate overridden by $GITHUB_ACTOR for $SHA (CI: $verdict). Reason: $REASON"
            echo "::warning::$msg"
            echo "### CI gate overridden" >>"$GITHUB_STEP_SUMMARY"
            echo "$msg" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::CI has not passed on $SHA (latest checks: $verdict). Refusing to publish. Run CI on this ref (gh workflow run ci.yml --ref <ref>) or dispatch with force=true and a reason."
          exit 1

  publish:
    needs: ci-gate
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/piiix-org/elara
            ghcr.io/piiix-org/chapters
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=semver,pattern=v{{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The runtime stage installs onnxruntime-node and sharp. Uncached,
          # that build is slow enough to time out patience, not CI.
          cache-from: type=gha
          cache-to: type=gha,mode=max
