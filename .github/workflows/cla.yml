name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/PIIIX-org/.github/blob/main/CLA.md'
          branch: 'main'
          # sadeqisaidmohaddes-star is the collaborator account this repo's
          # PRs are opened from (github-workflow.md step 8). Its commits carry
          # their normal author, so it never appeared on a PR — it surfaced
          # only on promotion #121, where the merge commits it created finally
          # entered the diff. Merging now happens from Taha-Mahmoodi, but the
          # four already in history still need it allowlisted.
          allowlist: Taha-Mahmoodi,sadeqisaidmohaddes-star,dependabot[bot]
