name: Fails before

# Every fix PR must carry a test that fails without the fix (#575). For a PR
# to `dev` titled `fix: ...` / `fix(scope): ...`, the `fails-before` job
# restores the base commit's source, keeps the PR's test files and helpers,
# runs only the test files the PR adds or changes, and passes only if at
# least one test fails there. Escape hatch: label `no-fails-before` plus a
# `Fails-before: n/a because ...` line in the PR body. Logic and messages:
# .github/scripts/fails-before.mjs; rules: docs/agents/github-workflow.md.
#
# Separate from ci.yml so a title, body or label edit re-evaluates this
# check without re-running the whole suite.

on:
  pull_request:
    branches: [dev]
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fails-before:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit and the merge-base must be in the clone.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Run the PR's changed tests against the base commit
        run: node .github/scripts/fails-before.mjs
