name: Fails before

# Every fix PR must carry a test that fails without the fix (#575). For a PR
# to `dev` titled `fix: ...` / `fix(scope): ...` (or `fix!:` /
# `fix(scope)!:`), the `fails-before` job restores the base commit's source,
# keeps the PR's test files and helpers, runs only the test files the PR adds
# or changes, and passes only if at least one test fails there. Escape hatch:
# label `no-fails-before` plus a `Fails-before: n/a because ...` line in the
# PR body. Logic and messages: .github/scripts/fails-before.mjs; rules:
# docs/agents/github-workflow.md.
#
# Separate from ci.yml so a title, body or label edit re-evaluates this
# check without re-running the whole suite.
#
# Also triggered on PRs to `prod`, where the job is skipped: the check is
# required on both branches (#574) and a required check whose workflow never
# starts would wait forever. A skipped job counts as passing. Every fix that
# a promotion carries already passed this check on its PR to `dev`.

on:
  pull_request:
    branches: [dev, prod]
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
      ]
  # GitHub starts no pull_request workflow for a PR opened or pushed with
  # GITHUB_TOKEN, so state-md.yml dispatches this on its PR's branch with
  # the PR number (#582). The run judges that PR (title, labels, body) as
  # above, and its check run lands on the PR's head commit.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number of a PR to dev (dispatch with --ref <its head branch>)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  fails-before:
    if: github.base_ref == 'dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A dispatch checks out GitHub's merge of the PR, like a PR event.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || '' }}
          # The base commit and the merge-base must be in the clone.
          fetch-depth: 0
          # PR test code runs in this job; keep the token out of .git/config.
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/dispatched-pr
        with:
          pr: ${{ inputs.pr }}
          bases: dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # HEAD is GitHub's merge of the PR into its base, so HEAD^1 is the base.
      # Run the base's copy of the checker so a PR cannot edit the check it is
      # judged by; until the base has one, run the PR's copy (the summary says
      # which).
      - name: Run the PR's changed tests against the base commit
        run: |
          export GITHUB_EVENT_PATH="${PR_EVENT_PATH:-$GITHUB_EVENT_PATH}"
          checker=.github/scripts/fails-before.mjs
          if git cat-file -e "HEAD^1:$checker" 2>/dev/null; then
            git show "HEAD^1:$checker" > "$RUNNER_TEMP/fails-before.mjs"
            FAILS_BEFORE_CHECKER=base node "$RUNNER_TEMP/fails-before.mjs"
          else
            FAILS_BEFORE_CHECKER=pr node "$checker"
          fi
