name: Production uptime

# Restart and outage alerts for production (#583). Every 10 minutes
# .github/scripts/uptime-monitor.mjs reads the public `/health` of
# https://chapters.piiix.org (one read-only GET: monitoring, not testing)
# and compares the process identity it reports (`bootId`, `startedAt`,
# `version`, `lastShutdown`) with the last one seen. The last-seen state is
# a hidden block in the body of the open issue "Production uptime" labelled
# `owner` (pinned). Alerts are comments on that issue, which notify its
# subscribers:
#   - restart: `bootId` changed; an `unclean` restart also adds the label
#     `unclean-restart`
#   - down: `/health` failed 2 checks in a row (once per outage)
#   - recovered: it answers again (once)
#   - weekly check-in: 7 days after the last one, so a monitor that stopped
#     running shows as a missing check-in (a failed scheduled run only
#     notifies whoever last edited the cron line)
# A `/health` without `bootId` (an image older than #583) never alerts.
#
# Errors, failed jobs and slow endpoints (#705): with the repository secret
# ELARA_MONITORING_TOKEN set (the same value as the production server's
# ELARA_MONITORING_TOKEN), the script also reads the authenticated
# `/api/admin/monitoring` while `/health` is up and comments on the same
# issue for:
#   - errors: new 5xx responses since the last check (>= repository
#     variable ALERT_ERROR_THRESHOLD, default 1)
#   - jobs: any new failed background job (embedding, extraction, sync,
#     collab-store, backup)
#   - slow: a route newly at p95 >= ALERT_SLOW_MS (default 2000) over
#     >= ALERT_SLOW_MIN_COUNT (default 5) requests in 15 minutes
#   - metrics-unavailable: the endpoint refuses while /health is up
# Secret unset: these are skipped and the run still passes. The token is
# only sent to production, never to a dispatched `url`. Optional secret
# ALERT_WEBHOOK_URL: every comment is also POSTed there as JSON.
#
# Scheduled runs use the default branch's copy (`dev`). By hand:
#   gh workflow run uptime.yml -R PIIIX-org/chapters                       # production
#   gh workflow run uptime.yml -R PIIIX-org/chapters -f dry_run=true       # posts and saves nothing
#   gh workflow run uptime.yml -R PIIIX-org/chapters -f url=https://other  # own state, same issue
# The lab runs the same script against its instance with a state file
# (lab/tests/uptime-monitor.test.ts). Docs: docs/agents/github-workflow.md
# (Production uptime monitor).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: Base URL whose /health is read (state is kept per URL).
        type: string
        default: https://chapters.piiix.org
      dry_run:
        description: Read /health and the issue, post and save nothing.
        type: boolean
        default: false

# One run at a time, so two runs never read the same state and alert twice.
concurrency:
  group: uptime-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check /health and alert on the uptime issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          URL: ${{ inputs.url || 'https://chapters.piiix.org' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          # Production only: a dispatch with another url must not receive it.
          ELARA_MONITORING_TOKEN: ${{ (inputs.url || 'https://chapters.piiix.org') == 'https://chapters.piiix.org' && secrets.ELARA_MONITORING_TOKEN || '' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_ERROR_THRESHOLD: ${{ vars.ALERT_ERROR_THRESHOLD }}
          ALERT_SLOW_MS: ${{ vars.ALERT_SLOW_MS }}
          ALERT_SLOW_MIN_COUNT: ${{ vars.ALERT_SLOW_MIN_COUNT }}
        run: |
          set -euo pipefail
          args=(--url "$URL")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node .github/scripts/uptime-monitor.mjs "${args[@]}"
