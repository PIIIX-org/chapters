name: CI

on:
  pull_request:
  push:
    branches: [dev, prod]
  # Re-runs checks on a ref by hand; on `prod` that also publishes once they
  # pass (used when a promotion's push event never starts CI, see
  # docs/agents/github-workflow.md).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: elara
          POSTGRES_PASSWORD: elara
          POSTGRES_DB: elara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elara"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test CI scripts
        run: node --test '.github/scripts/*.test.mjs'
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://elara:elara@localhost:5432/elara_test
          TEST_DATABASE_URL: postgres://elara:elara@localhost:5432/elara_test
          ADMIN_DATABASE_URL: postgres://elara:elara@localhost:5432/elara
          DATA_DIR: ${{ runner.temp }}/elara-test-data
      # Vault invariant gate (#578): every live note the server suite left
      # behind must have a file that parses and equals its row. Same database
      # and DATA_DIR as the Test step. A test that damages notes on purpose
      # must repair them or delete its vault before it ends.
      - name: Check note files left by the tests
        run: pnpm -C server check-notes
        env:
          DATABASE_URL: postgres://elara:elara@localhost:5432/elara_test
          DATA_DIR: ${{ runner.temp }}/elara-test-data

  # The only automatic path to the registry: the image for a `prod` commit is
  # published by this run, after `checks` passed on that same commit (#573).
  # publish.yml's gate refuses if the commit is no longer the `prod` head, so
  # re-running an old run cannot move `latest` back.
  publish:
    needs: checks
    if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish.yml
    with:
      ci_run_id: ${{ github.run_id }}
    permissions:
      actions: read
      contents: read
      packages: write
