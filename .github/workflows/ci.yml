name: CI

on:
  pull_request:
  push:
    branches: [dev, prod, dev-chroma, prod-chroma]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: elara
          POSTGRES_PASSWORD: elara
          POSTGRES_DB: elara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elara"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      chroma:
        image: chromadb/chroma:0.6.3
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://elara:elara@localhost:5432/elara_test
          TEST_DATABASE_URL: postgres://elara:elara@localhost:5432/elara_test
          ADMIN_DATABASE_URL: postgres://elara:elara@localhost:5432/elara
          CHROMA_URL: http://localhost:8000

