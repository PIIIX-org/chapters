name: Elara lab

# Integration tests where components meet: collab relay, note store, disk,
# Postgres and MCP over HTTP (#576). A throwaway Elara instance is built from
# this commit with the repo's own docker-compose.yml, bootstrapped through
# the real setup/signup/approval flow (lab/bootstrap.ts), then exercised by
# lab/tests/*.test.ts via lab/run.ts. Never deploys.
#
# Tiers (cost: the fast tier takes ~6 min, the full tier about an hour):
#   fast  PRs to dev that change what goes into the image or the lab:
#         server/**, client/**, lab/**, package.json, pnpm-lock.yaml,
#         pnpm-workspace.yaml, tsconfig.base.json, Dockerfile, .dockerignore,
#         docker-compose.yml, this workflow, the plan, the gate; pushes to lab/**.
#         Client collab code (useCollabDoc, useCodeMirrorEditor, api/collab)
#         adds the browser test to the fast tier; backup or restore code
#         (server/src/export/, the restore CLI, atomic-write, the test itself)
#         adds backup-restore (#493: restore-and-verify on every such PR).
#   full  nightly on dev, every PR to prod (promotions), and by hand:
#         gh workflow run elara-lab.yml --ref <branch> [-f tier=fast] [-f tests=a,b]
# The gate (.github/scripts/lab-gate.mjs) compares the results with
# lab/known-defects.json: a failed or inconclusive check outside the
# baseline, a baseline entry that no longer shows, or a crashed test fails
# the job. `plan`, `lab` and `bench-gate` are required checks on dev and
# prod (#574): keep them reporting on every PR (no path filter on the
# trigger; a skipped job passes). Docs: docs/agents/lab.md.
#
# The bench jobs (#570) run the premise benchmark (benchmarks/run.ts) on three
# lab instances of their own, in parallel with the lab job; bench-gate takes
# the per-metric median of the three and gates it against
# benchmarks/baseline.json (.github/scripts/bench-gate.mjs):
#   chapters  PRs to dev that change extraction, schema, server start-up/
#             config, the image's dependencies or the lab plumbing (~9 min)
#   all       PRs to dev that change search or MCP (server/src/search/**,
#             server/src/mcp/**: what shapes a response and its tokens) or
#             the benchmark (benchmarks/**); the gate then also requires every
#             suite to reach at least the base's golds (--require-golds).
#             Also nightly on dev, every PR to prod, and by hand (-f bench=...)
#             (80 to 170 min: embedding throughput varies between runners).
# The path rules are .github/scripts/lab-plan.mjs (unit-tested). Every job
# has a timeout-minutes; the bench matrix is fail-fast, so a failed or
# timed-out instance cancels the others and bench-gate reports the missing
# artifact at once instead of after the slowest instance.
# Docs: benchmarks/README.md. The bench-session job (#683) runs only on a
# dispatch with -f bench_session=plain|session.
#
# Merge queue: `merge_group` runs the same plan for the PR the queue branch
# names (gh-readonly-queue/<base>/pr-<N>-<sha>), so `plan`, `lab` and
# `bench-gate` report on the queue's temporary commit; HEAD^1 of that commit
# is the queue's base, so the base copies of the gates run as on PR events.
# The real-model job (#851) runs server/test/embedding-worker.test.ts with
# ELARA_REAL_MODEL_TESTS=1 (the real bge-small model, cached by actions/cache)
# with the nightly and with a full-tier dispatch.
#
# The nightly-alert job (#706) keeps one issue labelled `lab-nightly` in step
# with the scheduled run: a red nightly opens it (or comments on it) with the
# failed jobs, the run link and the gate summary; the next green nightly
# comments and closes it (.github/scripts/lab-nightly-alert.mjs). It posts
# only for `schedule` on dev; a dispatch with -f alert_dry_run=true runs it as
# a dry run (prints what it would post), and no other event runs it.
on:
  pull_request:
    branches: [dev, prod]
  merge_group:
    branches: [dev, prod]
  push:
    branches: ['lab/**']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'fast = PR tier, full = every test with its long parts'
        type: choice
        options: [full, fast, none]
        default: full
      bench:
        description: 'Premise benchmark suites: none, chapters, or all'
        type: choice
        options: [none, chapters, all]
        default: none
      bench_session:
        description: 'Session benchmark (#683, benchmarks/session/run.ts): none; plain (no session_id); question / suite (plain, then a session per question / per suite); session (plain, then both)'
        type: choice
        options: [none, plain, question, suite, session]
        default: none
      bench_session_suites:
        description: 'Session benchmark suites (comma list or all)'
        required: false
        default: 'all'
      tests:
        description: 'Comma-separated substrings of lab/tests file names (empty = every test of the tier)'
        required: false
        default: ''
      mcp_rate_limit:
        description: 'MCP_RATE_LIMIT per connection per minute (production default 120)'
        required: false
        default: '600'
      alert_dry_run:
        description: 'Run the nightly-alert job as a dry run (reads the lab-nightly issue, posts nothing)'
        type: boolean
        default: false

# The nightly gets its own group, so a dispatch or PR on dev never cancels it.
concurrency:
  group: elara-lab-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      also: ${{ steps.plan.outputs.also }}
      bench: ${{ steps.plan.outputs.bench }}
      golds: ${{ steps.plan.outputs.golds }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # On a PR the base and number come from the event; on a merge_group
      # event from the queue branch gh-readonly-queue/<base>/pr-<N>-<sha>.
      # The path rules live in .github/scripts/lab-plan.mjs (unit-tested).
      - name: Pick the tier
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_BENCH: ${{ inputs.bench }}
        run: |
          set -euo pipefail
          also=
          golds=false
          BASE_REF="${BASE_REF#refs/heads/}"
          if [ -n "$QUEUE_REF" ]; then
            PR=$(printf '%s' "$QUEUE_REF" | sed -En 's#^.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')
            [ -n "$PR" ] || { echo "cannot read the PR number from merge group ref $QUEUE_REF"; exit 1; }
          fi
          case "$GITHUB_EVENT_NAME" in
            schedule) tier=full; bench=all ;;
            workflow_dispatch) tier="$INPUT_TIER"; bench="$INPUT_BENCH" ;;
            push) tier=fast; bench=none ;;
            pull_request|merge_group)
              if [ "$BASE_REF" = prod ]; then
                tier=full
                bench=all
              else
                gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
                node .github/scripts/lab-plan.mjs --files "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/plan.txt"
                cat "$RUNNER_TEMP/plan.txt"
                tier=$(sed -n 's/^tier=//p' "$RUNNER_TEMP/plan.txt")
                also=$(sed -n 's/^also=//p' "$RUNNER_TEMP/plan.txt")
                bench=$(sed -n 's/^bench=//p' "$RUNNER_TEMP/plan.txt")
                golds=$(sed -n 's/^golds=//p' "$RUNNER_TEMP/plan.txt")
              fi
              ;;
            *) echo "unexpected event $GITHUB_EVENT_NAME"; exit 1 ;;
          esac
          {
            echo "tier=$tier"
            echo "also=$also"
            echo "bench=$bench"
            echo "golds=$golds"
            echo "pr=${PR:-}"
          } >> "$GITHUB_OUTPUT"
          note=
          if [ "$golds" = true ]; then note=' (every suite must keep its golds)'; fi
          echo "Lab tier: **$tier**${also:+ + $also}, benchmark: **$bench**$note ($GITHUB_EVENT_NAME${PR:+, PR #$PR})" >> "$GITHUB_STEP_SUMMARY"

  lab:
    needs: plan
    if: needs.plan.outputs.tier != 'none'
    runs-on: ubuntu-latest
    # Fast tier 7 to 9 min, full tier about an hour (docs/agents/lab.md).
    timeout-minutes: ${{ needs.plan.outputs.tier == 'full' && 180 || 60 }}
    permissions:
      contents: read
      issues: read
    env:
      COMPOSE: docker compose -f docker-compose.yml -f lab/docker-compose.lab.yml
      LAB_TIER: ${{ needs.plan.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a PR, HEAD is GitHub's merge into the base; HEAD^1 (the base)
          # must be in the clone for the gate step.
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ./.github/actions/lab-instance
        with:
          mcp_rate_limit: ${{ inputs.mcp_rate_limit || '600' }}

      - name: Install lab dependencies (@hocuspocus/provider, yjs, playwright)
        working-directory: lab
        run: bun install --frozen-lockfile

      - name: OKF reference parser (pinned) for export conformance
        run: |
          mkdir -p /tmp/okf-ref
          curl -fsSL https://raw.githubusercontent.com/GoogleCloudPlatform/open-knowledge-format/ad30107c31c06aec8a7d5636e0d1058118604e6f/src/reference_agent/bundle/document.py -o /tmp/okf-ref/okf_document.py
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --break-system-packages pyyaml
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Run lab tests (${{ needs.plan.outputs.tier }} tier)
        env:
          LAB_TESTS: ${{ inputs.tests }}
          LAB_ALSO: ${{ needs.plan.outputs.also }}
        run: bun lab/run.ts

      - name: Collect compose logs
        if: always()
        run: |
          mkdir -p lab-results
          $COMPOSE ps -a > lab-results/compose-ps.txt 2>&1 || true
          $COMPOSE logs --no-color --timestamps > lab-results/compose.log 2>&1 || true
          [ -f lab-results/summary.md ] && cat lab-results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      # Masking covers the job log, not artifacts: the app prints its setup
      # token into compose.log. Replace every generated secret before upload.
      - name: Redact secrets from lab-results
        if: always()
        run: bun lab/redact.ts lab-results

      # On a PR (or the merge queue's commit, whose HEAD^1 is the queue's
      # base), run the base's copy of the gate so a PR cannot edit the check
      # it is judged by (the baseline comes from the PR: updating it is part
      # of fixing a defect). The copy runs alone from $RUNNER_TEMP.
      - name: Gate against lab/known-defects.json
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gate=.github/scripts/lab-gate.mjs
          if { [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; } && git cat-file -e "HEAD^1:$gate" 2>/dev/null; then
            git show "HEAD^1:$gate" > "$RUNNER_TEMP/lab-gate.mjs"
            gate="$RUNNER_TEMP/lab-gate.mjs"
            echo "gate: base copy"
          fi
          node "$gate" --results lab-results --baseline lab/known-defects.json

      - name: Upload lab-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-results
          path: lab-results/
          retention-days: 30

  # Three instances of the same build: Elara's search has no tie-breaker for
  # equal scores (#623), so ranks move between instances; the gate uses the
  # median of the three. The gate needs all three, so the matrix is
  # fail-fast: one failed or timed-out instance cancels the others and
  # bench-gate reports at once. Budget: chapters 4 to 10 min measured; all
  # suites 80 to 170 min (embedding throughput differs between runners; run
  # 41189703249 took 80, 168 and over 180 min on its three instances). The
  # step budget is below the job's so the logs are still collected and
  # uploaded after a timeout.
  bench:
    needs: plan
    if: needs.plan.outputs.bench != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.plan.outputs.bench == 'all' && 240 || 45 }}
    strategy:
      fail-fast: true
      matrix:
        instance: [1, 2, 3]
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -f docker-compose.yml -f lab/docker-compose.lab.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: ripgrep (the baseline policy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      - uses: ./.github/actions/lab-instance
        with:
          mcp_rate_limit: ${{ inputs.mcp_rate_limit || '600' }}

      - name: Premise benchmark (${{ needs.plan.outputs.bench }}, instance ${{ matrix.instance }})
        timeout-minutes: ${{ needs.plan.outputs.bench == 'all' && 225 || 35 }}
        env:
          BENCH_SUITES: ${{ needs.plan.outputs.bench }}
          BENCH_INSTANCE: ${{ matrix.instance }}
        run: bun benchmarks/run.ts

      - name: Collect compose logs
        if: always()
        run: |
          mkdir -p bench-results
          $COMPOSE ps -a > bench-results/compose-ps.txt 2>&1 || true
          $COMPOSE logs --no-color --timestamps > bench-results/compose.log 2>&1 || true

      - name: Redact secrets from bench-results
        if: always()
        run: bun lab/redact.ts bench-results

      - name: Upload bench-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ matrix.instance }}
          path: bench-results/
          retention-days: 90

  bench-gate:
    needs: [plan, bench]
    if: always() && needs.plan.outputs.bench != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD^1 (the base, on a PR or a merge-queue commit) holds the gate and baseline the run is judged by.
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # A missing artifact is not an error here: the gate names it and fails.
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-results-*
          path: bench-runs

      # On a PR (or the merge queue's commit): the base's copy of the gate
      # decides, the base's baseline is the reference for regressions, and
      # the PR's labels and body are read now (not from the event), so
      # re-running this job after adding an override label picks it up.
      # Overrides: bench-suite-change, bench-baseline-lowered (see the gate's
      # header). With plan's golds=true (search, MCP or benchmark changed)
      # every suite must also reach at least the base's golds.
      - name: Gate against benchmarks/baseline.json (median of 3 instances)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr }}
          GOLDS: ${{ needs.plan.outputs.golds }}
        run: |
          gate=.github/scripts/bench-gate.mjs
          set -- --results bench-runs/bench-results-1/results.json,bench-runs/bench-results-2/results.json,bench-runs/bench-results-3/results.json --baseline benchmarks/baseline.json --out bench-gate
          if [ "$GOLDS" = true ]; then set -- "$@" --require-golds; fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            if git cat-file -e "HEAD^1:$gate" 2>/dev/null; then
              git show "HEAD^1:$gate" > "$RUNNER_TEMP/bench-gate.mjs"
              gate="$RUNNER_TEMP/bench-gate.mjs"
              echo "gate: base copy"
            fi
            if git cat-file -e HEAD^1:benchmarks/baseline.json 2>/dev/null; then
              git show HEAD^1:benchmarks/baseline.json > "$RUNNER_TEMP/base-baseline.json"
              set -- "$@" --base-baseline "$RUNNER_TEMP/base-baseline.json"
            fi
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pr.json"
            set -- "$@" --pr "$RUNNER_TEMP/pr.json"
          fi
          node "$gate" "$@"

      - name: Upload gate verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-gate
          path: bench-gate/
          retention-days: 90

  # #683: the session benchmark (benchmarks/session/run.ts), by hand only:
  #   gh workflow run elara-lab.yml --ref <branch> -f tier=none -f bench=none -f bench_session=session
  # A re-reading scripted agent on the premise suites; `session` runs it
  # without a `session_id`, with a new one per question, and with one per
  # suite, on the same instance (about 3 hours for all suites). Three
  # instances, like the bench job. Not a gate: the premise benchmark and its
  # fingerprint do not depend on it.
  bench-session:
    if: github.event_name == 'workflow_dispatch' && inputs.bench_session != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3]
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -f docker-compose.yml -f lab/docker-compose.lab.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: ./.github/actions/lab-instance
        with:
          mcp_rate_limit: ${{ inputs.mcp_rate_limit || '600' }}

      - name: Session benchmark (${{ inputs.bench_session }}, instance ${{ matrix.instance }})
        env:
          BENCH_SUITES: ${{ inputs.bench_session_suites || 'all' }}
          BENCH_INSTANCE: ${{ matrix.instance }}
          # plain: no session pass; question / suite: that scope; session: both.
          SCOPE: ${{ inputs.bench_session == 'session' && 'both' || inputs.bench_session != 'plain' && inputs.bench_session || '' }}
        run: |
          bun benchmarks/session/run.ts ${SCOPE:+--session-scope=$SCOPE}
          cat bench-session-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect compose logs
        if: always()
        run: |
          mkdir -p bench-session-results
          $COMPOSE ps -a > bench-session-results/compose-ps.txt 2>&1 || true
          $COMPOSE logs --no-color --timestamps > bench-session-results/compose.log 2>&1 || true

      - name: Redact secrets from bench-session-results
        if: always()
        run: bun lab/redact.ts bench-session-results

      - name: Upload bench-session-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-session-results-${{ matrix.instance }}
          path: bench-session-results/
          retention-days: 90

  # #851: the real bge-small model check (server/test/embedding-worker.test.ts),
  # kept out of the unit suite because it downloads ~133 MB. Runs with the
  # nightly and with a full-tier dispatch. A failed download reports the test
  # as skipped with its reason; wrong vectors or a blocked event loop fail the
  # job, which the nightly alert (#706) reports.
  real-model:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: elara
          POSTGRES_PASSWORD: elara
          POSTGRES_DB: elara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elara"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Transformers.js caches models in `.cache` inside its installed package.
      # The key is the model id plus the lockfile hash (a new Transformers.js
      # may change the cache layout); restore-keys falls back to the last cache
      # of the same model.
      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.pnpm/@huggingface+transformers@*/node_modules/@huggingface/transformers/.cache
          key: transformers-model-Xenova/bge-small-en-v1.5-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: transformers-model-Xenova/bge-small-en-v1.5-
      - id: test
        name: Real-model embedding test
        run: |
          pnpm -C server exec vitest run test/embedding-worker.test.ts --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/real-model.json"
          echo "passed=$(node -p 'require(process.argv[1]).numPassedTests' "$RUNNER_TEMP/real-model.json")" >> "$GITHUB_OUTPUT"
        env:
          ELARA_REAL_MODEL_TESTS: '1'
          DATABASE_URL: postgres://elara:elara@localhost:5432/elara_test
          TEST_DATABASE_URL: postgres://elara:elara@localhost:5432/elara_test
          ADMIN_DATABASE_URL: postgres://elara:elara@localhost:5432/elara
          DATA_DIR: ${{ runner.temp }}/elara-test-data
      # Save only a model the test loaded and passed with: a download cut short
      # (the test skipped) must not freeze a partial cache under this key.
      - if: steps.test.outputs.passed == '1' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules/.pnpm/@huggingface+transformers@*/node_modules/@huggingface/transformers/.cache
          key: ${{ steps.restore.outputs.cache-primary-key }}

  # #706: a red nightly opens (or comments on) the `lab-nightly` issue, the
  # next green nightly closes it. Live only for the schedule on dev; a
  # dispatch with alert_dry_run posts nothing. Never on PRs or pushes.
  nightly-alert:
    needs: [plan, lab, bench, bench-gate, real-model]
    if: >-
      always() && github.repository == 'PIIIX-org/chapters' &&
      ((github.event_name == 'schedule' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.alert_dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Either may be missing (the job was cancelled before its upload): the
      # alert then says there is no gate summary.
      - uses: actions/download-artifact@v8
        if: needs.lab.result != 'skipped'
        continue-on-error: true
        with:
          name: lab-results
          path: lab-results

      - uses: actions/download-artifact@v8
        if: needs.bench-gate.result != 'skipped'
        continue-on-error: true
        with:
          name: bench-gate
          path: bench-gate

      - name: Open, update or close the lab-nightly issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          DRY_RUN: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          args=(--lab-gate lab-results/gate.md --bench-gate bench-gate/gate.md)
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node .github/scripts/lab-nightly-alert.mjs "${args[@]}"
