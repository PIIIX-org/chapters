name: PR evidence

# Every PR body needs an Evidence section that links a run or artifact of
# this repo, and a claim (test counts, "verified", "100%", ...) needs a
# link next to it (#579). Covers PRs to `dev` and promotions to `prod`.
# Template: .github/pull_request_template.md. Logic, the claim list and
# messages: .github/scripts/pr-evidence.mjs; rules:
# docs/agents/github-workflow.md.
#
# Separate from ci.yml so a body edit re-evaluates this check without
# re-running the whole suite.
#
# Merge queue: on `merge_group` the script resolves the PR from the queue
# branch (gh-readonly-queue/<base>/pr-<N>-<sha>), reads its body from the
# API and judges it the same way, so the queue's temporary commit carries
# this required check. HEAD^1 of the queue commit is the queue's base, so
# the base copy of the checker runs there as on PR events.

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    branches: [dev, prod]

# A merge group's ref names its PR and base, so queue runs never cancel PR
# runs or each other's PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD is GitHub's merge of the PR into its base (or the queue's
          # merge commit); HEAD^1 (the base) must be in the clone.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Run the base's copy of the checker so a PR cannot edit the check it
      # is judged by; until the base has one, run the PR's copy (the summary
      # says which). The copy runs alone from $RUNNER_TEMP, so the script
      # must stay a single file with no sibling imports.
      - name: Check the PR body for evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          checker=.github/scripts/pr-evidence.mjs
          if git cat-file -e "HEAD^1:$checker" 2>/dev/null; then
            git show "HEAD^1:$checker" > "$RUNNER_TEMP/pr-evidence.mjs"
            PR_EVIDENCE_CHECKER=base node "$RUNNER_TEMP/pr-evidence.mjs"
          else
            PR_EVIDENCE_CHECKER=pr node "$checker"
          fi
