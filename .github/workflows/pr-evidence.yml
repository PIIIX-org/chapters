name: PR evidence

# Every PR body needs an Evidence section that links a run or artifact of
# this repo, and a claim (test counts, "verified", "100%", ...) needs a
# link next to it (#579). Covers PRs to `dev` and promotions to `prod`.
# Template: .github/pull_request_template.md. Logic, the claim list and
# messages: .github/scripts/pr-evidence.mjs; rules:
# docs/agents/github-workflow.md.
#
# Separate from ci.yml so a body edit re-evaluates this check without
# re-running the whole suite.

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # GitHub starts no pull_request workflow for a PR opened or pushed with
  # GITHUB_TOKEN, so state-md.yml dispatches this on its PR's branch with
  # the PR number (#582). The run checks that PR's current body, and its
  # check run lands on the PR's head commit (the dispatched ref's head).
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number (dispatch with --ref <its head branch>)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD is GitHub's merge of the PR into its base; HEAD^1 (the base)
          # must be in the clone. A dispatch checks out the same merge.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || '' }}
          fetch-depth: 2
          persist-credentials: false
      - if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/dispatched-pr
        with:
          pr: ${{ inputs.pr }}
          bases: dev prod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Run the base's copy of the checker so a PR cannot edit the check it
      # is judged by; until the base has one, run the PR's copy (the summary
      # says which). The copy runs alone from $RUNNER_TEMP, so the script
      # must stay a single file with no sibling imports.
      - name: Check the PR body for evidence
        run: |
          export GITHUB_EVENT_PATH="${PR_EVENT_PATH:-$GITHUB_EVENT_PATH}"
          checker=.github/scripts/pr-evidence.mjs
          if git cat-file -e "HEAD^1:$checker" 2>/dev/null; then
            git show "HEAD^1:$checker" > "$RUNNER_TEMP/pr-evidence.mjs"
            PR_EVIDENCE_CHECKER=base node "$RUNNER_TEMP/pr-evidence.mjs"
          else
            PR_EVIDENCE_CHECKER=pr node "$checker"
          fi
