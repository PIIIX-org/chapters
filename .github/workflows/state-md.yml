name: STATE.md

# Keeps the generated block of docs/agents/STATE.md current (#582).
# .github/scripts/state-md.mjs rebuilds the block between the
# `state:generated` markers from GitHub data (issues, milestones,
# promotions, runs on `dev`); the hand-written rest is left alone.
#
#   refresh  daily, on every push to `dev` and by hand
#            (`gh workflow run state-md.yml --ref dev`): when the block
#            changed, force-pushes `bot/state-md` (one commit on top of `dev`)
#            and opens or updates its PR to `dev`; when `dev` already matches,
#            closes that PR. The PR is opened with GITHUB_TOKEN, and GitHub
#            starts no pull_request workflows for it, so this job dispatches
#            the required checks on the branch itself: ci.yml (`checks`),
#            elara-lab.yml (`plan`; tier none and no benchmark, so `lab` and
#            `bench-gate` are skipped, as on any PR that changes neither the
#            image nor search), pr-evidence.yml and fails-before.yml (with the
#            PR number). Needs "Allow GitHub Actions to create and approve
#            pull requests" (organization and repository settings).
#   preview  on PRs that change the generator, this workflow or STATE.md:
#            prints the block it would write; writes nothing.
#
# The block holds no time and no run id of a passing run, so regenerating
# after the bot PR merges gives the same text and opens nothing. Docs:
# docs/agents/github-workflow.md (STATE.md).

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [dev]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/scripts/state-md.mjs
      - .github/workflows/state-md.yml
      - docs/agents/STATE.md

# One refresh at a time; a newer one waits and then rebuilds from the newer
# `dev`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the generated block (not committed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/state-md.mjs

  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push bot/state-md
      pull-requests: write # open, update or close its PR
      issues: read
      actions: write # read runs; dispatch the required checks
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bot/state-md
      TITLE: 'docs(state): refresh generated STATE.md block (bot)'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the generated block
        id: gen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/state-md.mjs

      - name: Open, update or close the bot PR
        env:
          CHANGED: ${{ steps.gen.outputs.changed }}
        run: |
          set -euo pipefail
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          pr=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')

          if [ "$CHANGED" != true ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch \
                --comment "The generated block on \`dev\` already matches GitHub data ($RUN_URL). Closing."
              summary "Closed #$pr: \`dev\` is current."
            else
              summary "STATE.md on \`dev\` is current; no PR needed."
            fi
            exit 0
          fi

          # The open PR may already carry this block on top of this `dev` head.
          if [ -n "$pr" ] && git fetch --quiet --depth 2 origin "$BRANCH" &&
            [ "$(git rev-parse FETCH_HEAD^)" = "$GITHUB_SHA" ] &&
            git diff --quiet FETCH_HEAD -- docs/agents/STATE.md; then
            summary "#$pr already has this block on \`dev\` $GITHUB_SHA; nothing to push."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --quiet -c "$BRANCH"
          git commit --quiet -m 'docs(state): refresh generated STATE.md block' \
            -m "Built by .github/scripts/state-md.mjs in $RUN_URL" -- docs/agents/STATE.md
          [ "$(git diff --name-only HEAD^ HEAD)" = docs/agents/STATE.md ] || { echo '::error::the bot commit must change only docs/agents/STATE.md'; exit 1; }
          git push --quiet --force origin "$BRANCH"
          head=$(git rev-parse HEAD)

          cat > "$RUNNER_TEMP/body.md" <<EOF
          ## Problem

          The generated block of \`docs/agents/STATE.md\` (between the \`state:generated\` markers) no longer matches GitHub data: issues, milestones, the last promotion or the latest runs on \`dev\` changed since it was last merged.

          ## Change

          Replaces that block with the one \`.github/scripts/state-md.mjs\` built from GitHub in the source run below, on top of \`dev\` $GITHUB_SHA. Nothing outside the markers changes. The \`state-md.yml\` workflow (#582) force-pushes this branch and rewrites this body whenever the block changes, and closes this PR once \`dev\` matches.

          ## Evidence

          - Source run (the block and what changed are in its summary): $RUN_URL
          - Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$head
          - Generator: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/$GITHUB_SHA/.github/scripts/state-md.mjs
          - GitHub starts no \`pull_request\` workflows for a PR opened with \`GITHUB_TOKEN\`, so the source run dispatched the required checks on \`$BRANCH\`: \`ci.yml\`, \`elara-lab.yml\` (tier none, no benchmark), \`pr-evidence.yml\` and \`fails-before.yml\` with this PR's number.

          ## Not covered

          The data is as of the source run. A reviewer checks that the diff touches only the generated block.
          EOF

          if [ -z "$pr" ]; then
            if ! url=$(gh pr create --base dev --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" 2>"$RUNNER_TEMP/err"); then
              cat "$RUNNER_TEMP/err"
              summary "Could not open the PR: $(cat "$RUNNER_TEMP/err"). \`$BRANCH\` is pushed. GITHUB_TOKEN can open PRs only when \"Allow GitHub Actions to create and approve pull requests\" is on in the organization and repository Actions settings (github-workflow.md, STATE.md)."
              echo "::error title=STATE.md PR::GitHub refused to open the PR; see the summary."
              exit 1
            fi
            pr=${url##*/}
            summary "Opened #$pr."
          else
            gh pr edit "$pr" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" > /dev/null
            summary "Updated #$pr."
          fi

          # The dispatched PR checks run on refs/pull/N/merge: wait until
          # GitHub has rebuilt it for this head.
          for _ in $(seq 1 24); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '"\(.head.sha) \(.mergeable)"')
            [ "$state" = "$head true" ] && break
            sleep 5
          done
          [ "$state" = "$head true" ] || { echo "::error::#$pr is not mergeable at $head ($state)"; exit 1; }

          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run elara-lab.yml --ref "$BRANCH" -f tier=none -f bench=none
          gh workflow run pr-evidence.yml --ref "$BRANCH" -f pr="$pr"
          gh workflow run fails-before.yml --ref "$BRANCH" -f pr="$pr"
          summary "Dispatched \`checks\`, \`plan\`/\`lab\`/\`bench-gate\`, \`pr-evidence\` and \`fails-before\` on \`$BRANCH\` ($head) for #$pr."
