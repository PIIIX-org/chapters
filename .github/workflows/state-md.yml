name: STATE.md

# Keeps the generated block of docs/agents/STATE.md current (#582).
# .github/scripts/state-md.mjs rebuilds the block between the
# `state:generated` markers from GitHub data (issues, milestones,
# promotions, runs on `dev`); the hand-written rest is left alone.
#
#   refresh  daily, on every push to `dev` and by hand
#            (`gh workflow run state-md.yml --ref dev`). When `dev`'s block
#            is stale, it writes the diff to the job summary and
#            force-pushes `bot/state-md` (one commit on top of `dev`).
#            - With the repository secret STATE_MD_TOKEN (an owner's
#              fine-grained token, Contents and Pull requests read/write),
#              it pushes and opens or updates the PR to `dev` with that
#              token. Events made with it start workflows, so the PR gets
#              its required checks like any other PR.
#            - Without it, the job pushes with GITHUB_TOKEN and fails with
#              instructions. GitHub starts no workflows for GITHUB_TOKEN
#              events and does not count checks from hand-started
#              (workflow_dispatch) runs toward a PR, so a PR opened or
#              updated here could never get its required checks. A person
#              opens the PR instead, or any PR runs
#              `node .github/scripts/state-md.mjs --write`.
#            When `dev` is current, it closes the bot PR and deletes the
#            branch.
#   preview  on PRs that change the generator, this workflow or STATE.md:
#            prints the block and whether the PR's STATE.md is current;
#            writes nothing.
#
# The block holds no time and no run id, so regenerating after the refreshed
# block merges gives the same text and opens nothing. Docs:
# docs/agents/github-workflow.md (STATE.md).

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [dev, fix-580-scratch]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/scripts/state-md.mjs
      - .github/workflows/state-md.yml
      - docs/agents/STATE.md

# One refresh at a time; a newer one waits and then rebuilds from the newer
# `dev`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the generated block (not written)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/state-md.mjs

  refresh:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/fix-580-scratch')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push bot/state-md without STATE_MD_TOKEN
      pull-requests: write # update or close the bot PR
      issues: read
      actions: read
    env:
      BRANCH: bot/state-md-scratch
      TITLE: 'docs(state): refresh generated STATE.md block (bot)'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HAS_TOKEN: ${{ secrets.STATE_MD_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The push and the PR use this token: with STATE_MD_TOKEN they
          # start the PR's workflows, with GITHUB_TOKEN they do not.
          token: ${{ secrets.STATE_MD_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the generated block
        id: gen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/state-md.mjs --write

      - name: Push bot/state-md and open, update or close its PR
        env:
          CHANGED: ${{ steps.gen.outputs.changed }}
          GH_TOKEN: ${{ secrets.STATE_MD_TOKEN || github.token }}
        run: |
          set -euo pipefail
          summary() { printf '%s\n\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          pr=$(gh pr list --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')

          if [ "$CHANGED" != true ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --comment "The generated block on \`dev\` already matches GitHub data ($RUN_URL). Closing."
              summary "Closed #$pr: \`dev\` is current."
            fi
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
              git push --quiet origin --delete "$BRANCH"
              summary "Deleted \`$BRANCH\`."
            fi
            summary "STATE.md on \`dev\` is current."
            exit 0
          fi

          { echo '### Diff against `dev`'; echo; echo '```diff'; git diff --no-color -- docs/agents/STATE.md; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"

          # Push unless the branch already carries this block on this `dev` head.
          pushed=false
          if git fetch --quiet --depth 2 origin "$BRANCH" 2>/dev/null &&
            [ "$(git rev-parse FETCH_HEAD^)" = "$GITHUB_SHA" ] &&
            git diff --quiet FETCH_HEAD -- docs/agents/STATE.md; then
            head=$(git rev-parse FETCH_HEAD)
            summary "\`$BRANCH\` already has this block on \`dev\` $GITHUB_SHA."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch --quiet -c "$BRANCH"
            git commit --quiet -m 'docs(state): refresh generated STATE.md block' \
              -m "Built by .github/scripts/state-md.mjs in $RUN_URL" -- docs/agents/STATE.md
            [ "$(git diff --name-only HEAD^ HEAD)" = docs/agents/STATE.md ] ||
              { echo '::error::the bot commit must change only docs/agents/STATE.md'; exit 1; }
            git push --quiet --force origin "$BRANCH"
            head=$(git rev-parse HEAD)
            pushed=true
            summary "Pushed \`$BRANCH\` at $head."
          fi

          cat > "$RUNNER_TEMP/body.md" <<EOF
          ## Problem

          The generated block of \`docs/agents/STATE.md\` (between the \`state:generated\` markers) no longer matches GitHub data: issues, milestones, the last promotion or the latest runs on \`dev\` changed since it was last merged.

          ## Change

          Replaces that block with the one \`.github/scripts/state-md.mjs\` built from GitHub in the source run below, on top of \`dev\` $GITHUB_SHA. Nothing outside the markers changes. The \`state-md.yml\` workflow (#582) force-pushes this branch and rewrites this body whenever the block changes, and closes this PR once \`dev\` matches.

          ## Evidence

          - Source run (the block and the diff are in its summary): $RUN_URL
          - Commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$head
          - Generator: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/.github/scripts/state-md.mjs

          ## Not covered

          The data is as of the source run. A reviewer checks that the diff touches only the generated block.
          EOF

          if [ "$HAS_TOKEN" = true ]; then
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" > /dev/null
              summary "Updated #$pr."
            else
              url=$(gh pr create --base dev --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
              summary "Opened $url."
            fi
            exit 0
          fi

          if [ -n "$pr" ] && [ "$pushed" = false ]; then
            summary "#$pr is open with this block; its checks ran when it was opened or last pushed."
            exit 0
          fi
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md" > /dev/null
            summary "Updated #$pr, but a push with GITHUB_TOKEN starts no workflows, so its required checks did not re-run. Close and reopen #$pr to run them."
          else
            summary "No PR opened: without the STATE_MD_TOKEN secret its required checks would never run."
          fi
          {
            echo '### To land this block'
            echo
            echo "- Open the PR yourself (a PR a person opens gets its checks): save the body below as \`body.md\` and run \`gh pr create --base dev --head $BRANCH --title '$TITLE' --body-file body.md\`."
            echo '- Or run `node .github/scripts/state-md.mjs --write` in any open PR and commit the result.'
            echo '- Owner action, once: add the repository secret `STATE_MD_TOKEN` (fine-grained personal access token for this repository with Contents and Pull requests read and write). This job then opens and updates the PR itself (docs/agents/github-workflow.md, STATE.md).'
            echo
            echo '```markdown'
            cat "$RUNNER_TEMP/body.md"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=STATE.md is stale::No STATE_MD_TOKEN secret, so no PR with checks could be opened; see the job summary."
          exit 1
