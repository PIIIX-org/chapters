<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Command Bridge Omni-Search</title>
  <style>
    body {
      margin: 0; padding: 20px;
      background-color: #050507; color: #F0F3F8;
      font-family: ui-monospace, monospace;
      display: flex; justify-content: center; align-items: flex-start;
      height: 100vh;
    }
    .palette-container {
      width: 100%; max-width: 600px;
      background-color: #0E1015;
      border: 1px solid #1F2430;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      overflow: hidden;
      margin-top: 10vh;
    }
    .input-row {
      display: flex; align-items: center;
      padding: 16px;
      border-bottom: 1px solid #1F2430;
    }
    .prompt {
      color: #38C77F; margin-right: 12px; font-weight: bold;
    }
    input {
      background: transparent; border: none; color: #F0F3F8;
      font-family: inherit; font-size: 16px; width: 100%; outline: none;
    }
    .list { margin: 0; padding: 0; list-style: none; }
    .list-item {
      padding: 12px 16px; display: flex; justify-content: space-between;
      border-bottom: 1px solid #1F2430; cursor: pointer;
    }
    .list-item:hover, .list-item.selected { background-color: #1A1E29; }
    .item-title { font-size: 13px; }
    .item-meta { font-size: 11px; color: #526077; }
    .chord {
      background: #1F2430; padding: 2px 6px; border-radius: 2px;
      color: #38C77F; font-size: 10px; font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="palette-container">
    <div class="input-row">
      <span class="prompt">&gt;</span>
      <input type="text" placeholder="Search telemetry, notes, or run MCP..." autofocus>
    </div>
    <ul class="list">
      <li class="list-item selected">
        <span class="item-title">Active Sync: chapters-core</span>
        <span class="item-meta"><span class="chord">Enter</span> connect</span>
      </li>
      <li class="list-item">
        <span class="item-title">Query Graph Hulls</span>
        <span class="item-meta"><span class="chord">Cmd+G</span> run</span>
      </li>
      <li class="list-item">
        <span class="item-title">System Status Diagnostics</span>
        <span class="item-meta"><span class="chord">Ctrl+D</span> view</span>
      </li>
    </ul>
  </div>
</body>
</html>
