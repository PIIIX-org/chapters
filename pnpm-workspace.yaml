packages:
  - server
  - shared
  - client
allowBuilds:
  '@tree-sitter-grammars/tree-sitter-kotlin': false
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  tree-sitter-c: false
  tree-sitter-c-sharp: false
  tree-sitter-cpp: false
  tree-sitter-go: false
  tree-sitter-java: false
  tree-sitter-javascript: false
  tree-sitter-php: false
  tree-sitter-python: false
  tree-sitter-ruby: false
  tree-sitter-rust: false
  tree-sitter-typescript: false
overrides:
  adm-zip: '>=0.6.1'
  find-my-way: '>=9.6.1'
  sharp: '>=0.35.4'
  hono: '>=4.13.5'
  '@hono/node-server': '>=1.19.15'
  qs: '>=6.16.0'
  fast-uri: '>=4.1.3'
  ip-address: '>=10.2.2'
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
  js-yaml: '>=4.3.2'
  undici: '>=7.29.0'
  esbuild: '>=0.25.0'
  lodash-es: '>=4.17.24'
  postcss: '>=8.5.23'
  nanoid: '>=3.3.18'
  vitest: ^5.0.5
  # Dependencies of grammar packages that only their native or grammar build
  # reads: a CLI (5.4 MB) and the C grammar C++'s grammar.js extends (a second
  # copy, 9 MB). Elara loads only each package's .wasm (#464).
  '@tree-sitter-grammars/tree-sitter-kotlin>npm-check-updates': '-'
  tree-sitter-cpp>tree-sitter-c: '-'
