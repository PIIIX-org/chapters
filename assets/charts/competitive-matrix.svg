<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Competitive Architectural Matrix: Chapters vs Alternatives">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1422"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12253B"/>
      <stop offset="100%" stop-color="#0C1726"/>
    </linearGradient>
    <linearGradient id="tagGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#2EC47C"/>
    </linearGradient>
    <linearGradient id="colSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B8DEF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chaptersColClip">
      <rect x="290" y="0" width="175" height="395" rx="4"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Geist Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist", Helvetica, Arial, sans-serif; }
      
      /* Neon perimeter tracer gliding smoothly around Chapters column */
      @keyframes traceCol {
        to { stroke-dashoffset: -1140; }
      }
      /* Vertical column sheen glide */
      @keyframes sheenDown {
        0% { transform: translateY(-395px); }
        40%, 100% { transform: translateY(395px); }
      }
      
      .perimeter-tracer {
        stroke-dasharray: 100 470;
        animation: traceCol 6s linear infinite;
      }
      .col-sheen-anim {
        animation: sheenDown 6s infinite ease-in-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .perimeter-tracer, .col-sheen-anim {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="1000" height="560" rx="4" fill="url(#compBg)" stroke="#1C2433" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(30, 24)">
    <text x="0" y="16" class="sans" font-size="18" font-weight="700" fill="#E2E8F4">Architectural Comparison Matrix: Chapters vs The Alternatives</text>
    <text x="0" y="36" class="mono" font-size="11.5" fill="#8B9BB4">
      Bridging the Gap Between Solitary Desktop Markdown, Closed Corporate Wikis, and Headless AST Scrapers
    </text>
  </g>

  <!-- Table Origin at (30, 75) -->
  <g transform="translate(30, 75)">
    <!-- Column Background for Chapters (Col 2: X=290, W=175, H=395) -->
    <rect x="290" y="0" width="175" height="395" rx="4" fill="url(#highlightGrad)" stroke="#1C2433" stroke-width="1.5"/>
    
    <!-- Vertical Sheen inside Chapters Column -->
    <g clip-path="url(#chaptersColClip)">
      <rect x="290" y="0" width="175" height="150" fill="url(#colSheen)" class="col-sheen-anim"/>
    </g>

    <!-- Animated Neon Perimeter Tracer around Chapters Column -->
    <rect x="290" y="0" width="175" height="395" rx="4" fill="none" stroke="#5B8DEF" stroke-width="2" class="perimeter-tracer"/>

    <!-- Table Header Row (Y=0, H=45) -->
    <rect x="0" y="0" width="940" height="45" fill="#0A0E17" stroke="#1C2433" stroke-width="1"/>
    
    <text x="18" y="27" class="mono" font-size="11" font-weight="700" fill="#8B9BB4">CAPABILITY / DIMENSION</text>
    
    <!-- Chapters Header Cell -->
    <rect x="295" y="6" width="165" height="32" rx="3" fill="url(#tagGlow)"/>
    <text x="377" y="26" class="sans" font-size="11.5" font-weight="800" fill="#070A0F" text-anchor="middle">★ CHAPTERS (ELARA)</text>

    <!-- Competitor Headers -->
    <text x="510" y="27" class="sans" font-size="11.5" font-weight="600" fill="#8B9BB4" text-anchor="middle">Obsidian</text>
    <text x="605" y="27" class="sans" font-size="11.5" font-weight="600" fill="#8B9BB4" text-anchor="middle">Swimm</text>
    <text x="700" y="27" class="sans" font-size="11.5" font-weight="600" fill="#8B9BB4" text-anchor="middle">Graphify</text>
    <text x="795" y="27" class="sans" font-size="11.5" font-weight="600" fill="#8B9BB4" text-anchor="middle">Outline</text>
    <text x="885" y="27" class="sans" font-size="11.5" font-weight="600" fill="#8B9BB4" text-anchor="middle">Notion</text>

    <!-- Row Generator -->

    <!-- Row at Y=45 -->
    <line x1="0" y1="45" x2="940" y2="45" stroke="#1C2433" stroke-width="1"/>
    <text x="18" y="75" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F4">Open-Source &amp; Self-Hostable</text>
    
    <!-- Chapters Cell (Col 2) - Crisp steady text -->
    <text x="377" y="75" class="mono" font-size="11" font-weight="700" fill="#2EC47C" text-anchor="middle">✓ (MIT License)</text>
    
    <!-- Competitor Cells -->
    <text x="510" y="75" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">⚠️ Local App</text>
    <text x="605" y="75" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕ Closed SaaS</text>
    <text x="700" y="75" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✓ Open Source</text>
    <text x="795" y="75" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✓ Self-Host</text>
    <text x="885" y="75" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕ Closed Cloud</text>

    <!-- Row at Y=95 -->
    <line x1="0" y1="95" x2="940" y2="95" stroke="#1C2433" stroke-width="1"/>
    <text x="18" y="125" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F4">Plain Markdown on Disk (Google OKF v0.2)</text>
    
    <!-- Chapters Cell (Col 2) - Crisp steady text -->
    <text x="377" y="125" class="mono" font-size="11" font-weight="700" fill="#2EC47C" text-anchor="middle">✓ Strict ISO 8601</text>
    
    <!-- Competitor Cells -->
    <text x="510" y="125" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">⚠️ Generic MD</text>
    <text x="605" y="125" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="700" y="125" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="795" y="125" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕ (DB Store)</text>
    <text x="885" y="125" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕ (Locked DB)</text>

    <!-- Row at Y=145 -->
    <line x1="0" y1="145" x2="940" y2="145" stroke="#1C2433" stroke-width="1"/>
    <text x="18" y="175" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F4">Real-Time CRDT Multiplayer</text>
    
    <!-- Chapters Cell (Col 2) - Crisp steady text -->
    <text x="377" y="175" class="mono" font-size="11" font-weight="700" fill="#2EC47C" text-anchor="middle">✓ Yjs CRDT Relay</text>
    
    <!-- Competitor Cells -->
    <text x="510" y="175" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕ Git Conflicts</text>
    <text x="605" y="175" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕ PR Workflow</text>
    <text x="700" y="175" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕ Single CLI</text>
    <text x="795" y="175" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✓ Real-Time</text>
    <text x="885" y="175" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✓ Cloud OT</text>

    <!-- Row at Y=195 -->
    <line x1="0" y1="195" x2="940" y2="195" stroke="#1C2433" stroke-width="1"/>
    <text x="18" y="225" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F4">Git Ingestion &amp; Tree-sitter AST Anchors</text>
    
    <!-- Chapters Cell (Col 2) - Crisp steady text -->
    <text x="377" y="225" class="mono" font-size="11" font-weight="700" fill="#2EC47C" text-anchor="middle">✓ [[repo:#symbol]]</text>
    
    <!-- Competitor Cells -->
    <text x="510" y="225" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="605" y="225" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✓ IDE Plugin</text>
    <text x="700" y="225" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✓ AST Index</text>
    <text x="795" y="225" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="885" y="225" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕ (Dead Snippets)</text>

    <!-- Row at Y=245 -->
    <line x1="0" y1="245" x2="940" y2="245" stroke="#1C2433" stroke-width="1"/>
    <text x="18" y="275" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F4">Unified Note + Code Knowledge Graph</text>
    
    <!-- Chapters Cell (Col 2) - Crisp steady text -->
    <text x="377" y="275" class="mono" font-size="11" font-weight="700" fill="#2EC47C" text-anchor="middle">✓ Louvain + Dijkstra</text>
    
    <!-- Competitor Cells -->
    <text x="510" y="275" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">⚠️ Notes Only</text>
    <text x="605" y="275" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="700" y="275" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">⚠️ Code Only</text>
    <text x="795" y="275" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="885" y="275" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>

    <!-- Row at Y=295 -->
    <line x1="0" y1="295" x2="940" y2="295" stroke="#1C2433" stroke-width="1"/>
    <text x="18" y="325" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F4">Native 57-Tool Model Context Protocol</text>
    
    <!-- Chapters Cell (Col 2) - Crisp steady text -->
    <text x="377" y="325" class="mono" font-size="11" font-weight="700" fill="#2EC47C" text-anchor="middle">✓ 57 Tools · 20 Prompts</text>
    
    <!-- Competitor Cells -->
    <text x="510" y="325" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">⚠️ Community</text>
    <text x="605" y="325" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="700" y="325" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">⚠️ CLI Pipe</text>
    <text x="795" y="325" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="885" y="325" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">⚠️ REST API</text>

    <!-- Row at Y=345 -->
    <line x1="0" y1="345" x2="940" y2="345" stroke="#1C2433" stroke-width="1"/>
    <text x="18" y="375" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F4">High-Throughput Vector Decoupling</text>
    
    <!-- Chapters Cell (Col 2) - Crisp steady text -->
    <text x="377" y="375" class="mono" font-size="11" font-weight="700" fill="#2EC47C" text-anchor="middle">✓ pgvector + Chroma</text>
    
    <!-- Competitor Cells -->
    <text x="510" y="375" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="605" y="375" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="700" y="375" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="795" y="375" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕</text>
    <text x="885" y="375" class="mono" font-size="10" fill="#8B9BB4" text-anchor="middle">✕ (Cloud AI)</text>

    <!-- Bottom Grid Closing Line -->
    <line x1="0" y1="395" x2="940" y2="395" stroke="#1C2433" stroke-width="1"/>
  </g>

  <!-- Bottom Synthesis Callout -->
  <rect x="30" y="495" width="940" height="40" rx="3" fill="#0A0E17" stroke="#1C2433" stroke-width="1"/>
  <circle cx="48" cy="515" r="4" fill="#2EC47C"/>
  <text x="62" y="519" class="mono" font-size="10" fill="#8B9BB4">
    <tspan fill="#E2E8F4" font-weight="700">The Living Second Brain Formula:</tspan> Obsidian's Markdown speed + Outline's team collaboration + Swimm's AST code-coupling + Graphify's agentic MCP navigation.
  </text>
</svg>
