<svg width="235" height="28" viewBox="0 0 235 28" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SECURITY: 21/21 Vectors Blocked">
  <defs>
    <linearGradient id="bg_SECURITY" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>
    <linearGradient id="badgeSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect width="235" height="28" rx="3"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes sheenSweep {
        0% { transform: translateX(-235px); }
        30%, 100% { transform: translateX(235px); }
      }
      .badge-sheen { animation: sheenSweep 5s infinite ease-in-out; }
      @media (prefers-reduced-motion: reduce) {
        .badge-sheen { animation: none !important; }
      }
    </style>
  </defs>
  <rect width="235" height="28" rx="3" fill="url(#bg_SECURITY)" stroke="#1C2433" stroke-width="1"/>
  
  <!-- Subtle linear shimmer sheen (zero pulse, zero dot movement) -->
  <g clip-path="url(#badgeClip)">
    <rect x="0" y="0" width="117" height="28" fill="url(#badgeSheen)" class="badge-sheen"/>
  </g>

  <!-- Perfectly aligned static indicator pip -->
  <circle cx="12" cy="14.0" r="3" fill="#2EC47C"/>
  <text x="22" y="17.8" class="mono" font-size="10" font-weight="700" fill="#8B9BB4" letter-spacing="0.5">SECURITY</text>
  <line x1="80.4" y1="5" x2="80.4" y2="23" stroke="#1C2433" stroke-width="1"/>
  <text x="88.4" y="17.8" class="mono" font-size="10.5" font-weight="600" fill="#2EC47C">21/21 Vectors Blocked</text>
</svg>